name: TF3 Map Studio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pytest 'pyinstaller>=6.22,<7'
      - run: python -m pytest -q tests
  tools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tool: [OSM-TF3-Vanilla-Converter, TF3-Heightmap-Studio, TF3-OSM-Importer-Mod]
    defaults:
      run:
        working-directory: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt pytest
      - run: python -m pytest -q
  windows-apps:
    needs: [tools, release-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Provision a complete private interpreter and packages for each app
        shell: pwsh
        run: |
          foreach ($tool in @('TF3-Heightmap-Studio','OSM-TF3-Vanilla-Converter')) {
            python -I scripts/private_runtime.py provision --tool $tool --source $env:pythonLocation
            if ($LASTEXITCODE -ne 0) { throw "Private runtime provisioning failed: $tool" }
            & "$tool/.runtime/python.exe" -I scripts/private_runtime.py install --tool $tool
            if ($LASTEXITCODE -ne 0) { throw "Private package provisioning failed: $tool" }
          }
      - run: ./TF3-Heightmap-Studio/build.ps1
      - run: ./OSM-TF3-Vanilla-Converter/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TF3-Map-Studio-Windows
          path: |
            TF3-Heightmap-Studio/dist/*.exe
            OSM-TF3-Vanilla-Converter/dist/*.exe
            TF3-Heightmap-Studio/dist/*-manifest.json
            OSM-TF3-Vanilla-Converter/dist/*-manifest.json
            TF3-Heightmap-Studio/dist/runtime-check.json
            OSM-TF3-Vanilla-Converter/dist/runtime-check.json
